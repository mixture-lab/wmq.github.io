<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王茂樵的主页</title>
    <style>
       * {            
margin: 0;            
padding: 0;            
box-sizing: border-box;        
}        
body {            
background: #00000a;
color: #cccccc;            
font-family: "Microsoft Yahei", sans-serif;            
min-height: 100vh;            
display: flex;            
flex-direction: column;            
align-items: center;            
justify-content: center;            
gap: 30px;
overflow: hidden;
position: relative;
}
.star {
    position: absolute;
    background-color: #fff;
    border-radius: 50%;
    animation: twinkle 4s infinite ease-in-out;
}
@keyframes twinkle {
    0%,100% { opacity: 0.2; }
    50% { opacity: 1; }
}
h1 {            
font-size: 42px;            
font-weight: 300;            
letter-spacing: 6px;            
color: #ffffff;
z-index: 2;        
}
.subtitle {            
color: #777;            
font-size: 16px;
z-index: 2;        
}
.link-group a {            
display: inline-block;            
color: #bbb;            
text-decoration: none;            
padding: 10px 22px;            
border: 1px solid #2a2a2a;            
border-radius: 8px;            
margin: 0 8px;            
transition: 0.3s;
z-index: 2;        
}
.link-group a:hover {            
border-color: #666;            
color: white;        
}
    </style>
</head>
<body>
    <h1>陈建文，这里是神的网站，滚出去</h1>
    <div class="subtitle">九牛一毛，冰山一角</div>
    <div class="link-group">
        <a href="https://m.baike.com/wiki/%E5%9F%83%E9%9A%86%C2%B7%E9%A9%AC%E6%96%AF%E5%85%8B/7675217" target="_blank">关于神本人</a>
        <a href="https://baike.baidu.com/item/%E9%98%BF%E5%B0%94%E5%BF%92%E7%B1%B3%E6%96%AF%E8%AE%A1%E5%88%92" target="_blank">神的项目</a>
        <a href="https://www.kanunu8.com/book3/7720/" target="_blank">神的留言</a>
    </div>

<script>
const starCount = 350;
for(let i=0; i<starCount; i++){
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random()*2 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random()*100 + '%';
    star.style.top = Math.random()*100 + '%';
    star.style.animationDelay = Math.random()*4 + 's';
    document.body.appendChild(star);
}
</script>
</body>
</html>
