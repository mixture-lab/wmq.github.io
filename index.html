<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #cccccc;
            font-family: "Microsoft Yahei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 6px;
            color: #ffffff;
        }
        .subtitle {
            color: #777;
            font-size: 16px;
        }
        .link-group a {
            display: inline-block;
            color: #bbb;
            text-decoration: none;
            padding: 10px 22px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            margin: 0 8px;
            transition: 0.3s;
        }
        .link-group a:hover {
            border-color: #666;
            color: white;
        }
    </style>
</head>
<body>
    <h1>你好，这里是我的网站</h1>
    <div class="subtitle">mixture-lab.github.io/wmq.github.io</div>
    <div class="link-group">
        <a href="#">关于我</a>
        <a href="#">项目</a>
        <a href="#">留言</a>
    </div>
</body>
</html>
